<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de QR</title>

  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #0f172a;
      background: linear-gradient(135deg, #0f172a, #312e81, #7c3aed);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(20px);
      opacity: 0.55;
      z-index: 0;
    }

    body::before {
      background: #22d3ee;
      top: -120px;
      left: -100px;
    }

    body::after {
      background: #f472b6;
      bottom: -130px;
      right: -90px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      position: relative;
      z-index: 1;
    }

    .app {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 34px;
      padding: 24px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
    }

    .panel {
      background: rgba(255, 255, 255, 0.78);
      border-radius: 28px;
      padding: 30px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .header-tag {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      color: white;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      line-height: 1.05;
      color: #111827;
      letter-spacing: -1px;
    }

    .subtitle {
      color: #475569;
      margin: 14px 0 28px;
      font-size: 16px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 700;
      font-size: 13px;
      color: #334155;
    }

    input,
    select {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      border-radius: 18px;
      font-size: 15px;
      color: #0f172a;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      transition: 0.2s ease;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #7c3aed;
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
      background: white;
    }

    input[type="color"] {
      height: 54px;
      padding: 6px;
      cursor: pointer;
    }

    input[type="file"] {
      cursor: pointer;
    }

    .buttons {
      display: flex;
      gap: 14px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 15px 24px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 800;
      transition: 0.2s ease;
    }

    .btn-primary {
      color: white;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      box-shadow: 0 15px 30px rgba(124, 58, 237, 0.35);
    }

    .btn-primary:hover,
    .btn-secondary:hover {
      transform: translateY(-3px);
    }

    .btn-secondary {
      display: none;
      color: #111827;
      background: white;
      box-shadow: 0 12px 25px rgba(15, 23, 42, 0.12);
    }

    .preview-panel {
      position: relative;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.72);
      border-radius: 28px;
      padding: 28px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 620px;
    }

    .preview-panel::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(34, 211, 238, 0.28);
      top: -90px;
      right: -100px;
    }

    .preview-panel::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(244, 114, 182, 0.25);
      bottom: -100px;
      left: -90px;
    }

    .preview-title {
      position: relative;
      z-index: 1;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 18px;
      text-align: center;
    }

    #qrcode {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 360px;
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 25px 55px rgba(0, 0, 0, 0.35);
    }

    #qrcode:empty::before {
      content: "Tu QR aparecerá aquí";
      color: #64748b;
      font-weight: 700;
      text-align: center;
    }

    #qrcode canvas,
    #qrcode svg {
      max-width: 100%;
      height: auto;
      border-radius: 18px;
    }

    .preview-text {
      position: relative;
      z-index: 1;
      text-align: center;
      color: #cbd5e1;
      margin-top: 22px;
      font-size: 14px;
      line-height: 1.5;
      max-width: 340px;
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }

      .preview-panel {
        min-height: 480px;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      .app {
        padding: 14px;
        border-radius: 26px;
      }

      .panel,
      .preview-panel {
        padding: 22px;
        border-radius: 22px;
      }

      h1 {
        font-size: 32px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      #qrcode {
        min-height: 290px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="app">
      <div class="panel">
        <span class="header-tag">QR personalizado</span>
        <h1>Generador de códigos QR</h1>
        <p class="subtitle">
          Crea un QR con colores, estilo, esquinas y logo personalizado.
        </p>

        <div class="grid">
          <div class="form-group full">
            <label for="inputurl">Texto o URL</label>
            <input type="text" id="inputurl" placeholder="https://ejemplo.com" />
          </div>

          <div class="form-group">
            <label for="qrColor">Color del QR</label>
            <input type="color" id="qrColor" value="#111827" />
          </div>

          <div class="form-group">
            <label for="qrBgColor">Color de fondo del QR</label>
            <input type="color" id="qrBgColor" value="#ffffff" />
          </div>

          <div class="form-group">
            <label for="cornerColor">Color de esquinas</label>
            <input type="color" id="cornerColor" value="#7c3aed" />
          </div>

          <div class="form-group">
            <label for="qrShape">Forma del QR</label>
            <select id="qrShape">
              <option value="square">Cuadrado</option>
              <option value="dots">Puntos</option>
              <option value="rounded">Redondeado</option>
              <option value="classy">Clásico</option>
              <option value="classy-rounded">Clásico redondeado</option>
              <option value="extra-rounded">Extra redondeado</option>
            </select>
          </div>

          <div class="form-group">
            <label for="cornerShape">Forma de esquinas</label>
            <select id="cornerShape">
              <option value="square">Cuadradas</option>
              <option value="dot">Puntos</option>
              <option value="extra-rounded">Extra redondeadas</option>
            </select>
          </div>

          <div class="form-group">
            <label for="logo">Logo opcional</label>
            <input type="file" id="logo" accept="image/*" />
          </div>
        </div>

        <div class="buttons">
          <button class="btn-primary" onclick="generarQR()">Generar QR</button>
          <button class="btn-secondary" id="descargarQR">Descargar PNG</button>
        </div>
      </div>

      <div class="preview-panel">
        <div class="preview-title">Vista previa</div>
        <div id="qrcode"></div>
        <p class="preview-text">
          Para mejores resultados, usa contraste alto entre el color del QR y el fondo.
        </p>
      </div>
    </div>
  </div>

  <script>
    let qrCode;
    let logoDataUrl = "";

    document.getElementById("logo").addEventListener("change", function(event) {
      const file = event.target.files[0];

      if (file) {
        const reader = new FileReader();

        reader.onload = function(e) {
          logoDataUrl = e.target.result;
        };

        reader.readAsDataURL(file);
      }
    });

    function generarQR() {
      const texto = document.getElementById("inputurl").value.trim();
      const colorQR = document.getElementById("qrColor").value;
      const colorFondo = document.getElementById("qrBgColor").value;
      const colorEsquinas = document.getElementById("cornerColor").value;
      const formaQR = document.getElementById("qrShape").value;
      const formaEsquinas = document.getElementById("cornerShape").value;

      if (!texto) {
        alert("Por favor ingresa una URL o texto para generar el QR.");
        return;
      }

      document.getElementById("qrcode").innerHTML = "";

      qrCode = new QRCodeStyling({
        width: 500,
        height: 500,
        type: "canvas",
        data: texto,

        dotsOptions: {
          color: colorQR,
          type: formaQR
        },

        backgroundOptions: {
          color: colorFondo
        },

        cornersSquareOptions: {
          color: colorEsquinas,
          type: formaEsquinas
        },

        cornersDotOptions: {
          color: colorEsquinas,
          type: formaEsquinas === "dot" ? "dot" : "square"
        },

        image: logoDataUrl || "",

        imageOptions: {
          crossOrigin: "anonymous",
          margin: 10,
          imageSize: 0.60
        }
      });

      qrCode.append(document.getElementById("qrcode"));
      document.getElementById("descargarQR").style.display = "inline-block";
    }

    document.getElementById("descargarQR").addEventListener("click", function() {
      if (qrCode) {
        qrCode.download({
          name: "QR_Code",
          extension: "png"
        });
      }
    });
  </script>
</body>
</html>
